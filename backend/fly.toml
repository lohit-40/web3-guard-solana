# fly.toml — Web3 Guard Backend
# Deploy with: flyctl deploy --config fly.toml (from backend/ folder)

app = "web3guard-backend"
primary_region = "sin"   # Singapore — closest to India

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # All secret env vars are set via: flyctl secrets set KEY=VALUE
  # Do NOT put real keys here

[[services]]
  protocol    = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval    = "15s"
    timeout     = "2s"
    grace_period = "5s"

  [[services.http_checks]]
    interval    = "30s"
    timeout     = "5s"
    grace_period = "10s"
    method      = "get"
    path        = "/health"

# Persistent volume for SQLite database
# Create with: flyctl volumes create web3guard_data --size 1 --region sin
[[mounts]]
  source      = "web3guard_data"
  destination = "/data"

[resources]
  # Shared CPU, 256MB RAM — free tier
  memory = "256"
